
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | VisitLog</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        /* ===== COLOR PALETTE ===== */

        :root {
            --primary-blue: #2a5caa;
            --primary-dark: #204987;
            --primary-hover: #3470c5;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border-color: #d1d5db;
            --bg-light-blue: #e3edfa;
            --bg-body: #f3f6fb;
            --danger-red: #dc2626;
            --surface: #ffffff;
        }

        /* ===== RESET ===== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-body);
            color: var(--text-dark);
            font-family: 'Inter', Arial, sans-serif;
        }

        /* ===== LOGIN CONTAINER ===== */

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            overflow: hidden;
            width: 100%;
            padding: 36px;
            border: 1px solid #e5eaf2;
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 8px 30px rgba(42, 92, 170, 0.09);
        }

        /* ===== LOGO ===== */

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 12px;
            background: var(--primary-blue);
            color: #ffffff;
            font-size: 22px;
        }

        .logo-text h1 {
            color: var(--primary-blue);
            font-size: 25px;
            font-weight: 700;
            line-height: 1.3;
        }

        .logo-text p {
            margin-top: 3px;
            color: var(--text-light);
            font-size: 12px;
        }

        /* ===== HEADING ===== */

        .login-heading {
            margin-bottom: 28px;
            text-align: center;
        }

        .login-heading h2 {
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 22px;
            font-weight: 700;
        }

        .login-heading p {
            color: var(--text-light);
            font-size: 13px;
            line-height: 1.6;
        }

        /* ===== FORM ===== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
            transform: translateY(-50%);
        }

        .form-group input {
            display: block;
            width: 100%;
            height: 46px;
            padding: 0 14px 0 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text-dark);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(42, 92, 170, 0.12);
        }

        /* ===== ERROR MESSAGE ===== */

        .error {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: var(--danger-red);
            font-size: 13px;
            line-height: 1.5;
        }

        .error i {
            margin-top: 2px;
        }

        /* ===== LOGIN BUTTON ===== */

        .login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            min-height: 46px;
            margin-top: 8px;
            border: 1px solid var(--primary-blue);
            border-radius: 8px;
            background: var(--primary-blue);
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s;
        }

        .login-button:hover {
            border-color: var(--primary-dark);
            background: var(--primary-dark);
        }

        .login-button:active {
            transform: scale(0.99);
        }

        .login-button:focus-visible {
            outline: 3px solid rgba(42, 92, 170, 0.25);
            outline-offset: 3px;
        }

        /* ===== FOOTER ===== */

        .login-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #edf0f4;
            color: var(--text-light);
            font-size: 11px;
            line-height: 1.7;
            text-align: center;
        }

        .login-footer i {
            margin-right: 5px;
            color: var(--primary-blue);
        }

        /* ===== MOBILE ===== */

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 13px;
            }

            .logo-section {
                margin-bottom: 24px;
            }

            .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            .logo-text h1 {
                font-size: 23px;
            }

            .login-heading h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="login-wrapper">
        <section class="login-card">

            <!-- HEADING -->
            <div class="login-heading">
                <h2>Staff Login</h2>
                <p>
                    Sign in to access the visitor records
                    and dashboard.
                </p>
            </div>

            <!-- LOGIN FORM -->
            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="error" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>
                            Incorrect username or password.
                            Please try again.
                        </span>
                    </div>
                {% endif %}

                <!-- USERNAME -->
                <div class="form-group">
                    <label for="id_username">Username</label>

                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>

                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="id_password">Password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="login-button">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Log In</span>
                </button>
            </form>

            <!-- FOOTER -->
            <footer class="login-footer">
                <i class="fa-solid fa-shield-halved"></i>
                Authorized personnel only.
                Please keep your login credentials secure.
            </footer>

        </section>
    </main>
</body>
</html>
